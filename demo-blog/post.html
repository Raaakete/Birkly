<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - Demo Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">{{ site_title }}</a></h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <article class="post" id="post-content">
            <div style="text-align: center; padding: 2rem;">
                <p>Loading post...</p>
            </div>
        </article>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ site_title }} {{ current_year }}</p>
        </div>
    </footer>

    <!-- HaruCMS Client Library -->
    <!-- In production, this would be: <script src="https://your-cms-domain.com/harucms-client.js"></script> -->
    <script src="/harucms-client.js" data-cms-url="http://localhost:8080"></script>
    <script>
        // Get slug from URL
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        
        // Wait for HaruCMS to initialize and then fetch the specific post
        document.addEventListener('DOMContentLoaded', async function() {
            // Wait a bit for HaruCMS to initialize
            await new Promise(resolve => setTimeout(resolve, 100));
            
            if (!slug) {
                document.getElementById('post-content').innerHTML = '<div style="text-align: center; padding: 2rem;"><p>Post not found. <a href="index.html">← Back to Blog</a></p></div>';
                return;
            }
            
            if (window.HaruCMS && window.HaruCMS.getEntryBySlug) {
                const postContainer = document.getElementById('post-content');
                
                // Fetch the specific entry by slug
                const entry = await window.HaruCMS.getEntryBySlug('blog', slug);
                
                if (entry) {
                    // Render the post
                    const formattedDate = formatDate(entry.created_at, 'F j, Y');
                    const tagsHtml = entry.tags && entry.tags.length > 0
                        ? `<div class="tags">${entry.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div>`
                        : '';
                    
                    postContainer.innerHTML = `
                        <h1>${escapeHtml(entry.title || '')}</h1>
                        <div class="post-meta">
                            <time>${formattedDate}</time>
                            ${tagsHtml}
                        </div>
                        <div class="post-content">
                            ${entry.content || ''}
                        </div>
                        <nav class="post-navigation">
                            <a href="index.html">← Back to Blog</a>
                        </nav>
                    `;
                    
                    // Update page title
                    document.title = `${entry.title} - Demo Blog`;
                } else {
                    postContainer.innerHTML = '<div style="text-align: center; padding: 2rem;"><p>Post not found. <a href="index.html">← Back to Blog</a></p></div>';
                }
                
                // Update site title and year
                const siteTitle = document.querySelector('h1 a');
                if (siteTitle) {
                    siteTitle.textContent = 'Demo Blog';
                }
                
                const footer = document.querySelector('footer p');
                if (footer) {
                    footer.textContent = `© Demo Blog ${new Date().getFullYear()}`;
                }
            }
        });
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(dateString, format) {
            if (!dateString) return '';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const day = date.getDate();
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            
            return format
                .replace('F', month)
                .replace('j', day)
                .replace('Y', year);
        }
    </script>
</body>
</html>
