<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ site_title }}</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="index.html">{{ site_title }}</a></h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <article class="post">
            <h1>{{ title }}</h1>
            <div class="post-meta">
                <time>{{ created_at|date:"F j, Y" }}</time>
                {if tags exist}
                <div class="tags">
                    {foreach tags as tag}
                    <span class="tag">{{ tag }}</span>
                    {endforeach}
                </div>
                {endif}
            </div>
            <div class="post-content">
                {{ content|raw }}
            </div>
            <nav class="post-navigation">
                <a href="index.html">← Back to Blog</a>
            </nav>
        </article>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ site_title }} {{ current_year }}</p>
        </div>
    </footer>
</body>
</html>
