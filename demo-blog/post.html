<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - {{ site_title }}</title>
    <link rel="stylesheet" href="/demo-blog/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/demo-blog/index.html">{{ site_title }}</a></h1>
            <nav>
                <a href="/demo-blog/index.html">Home</a>
                <a href="/demo-blog/about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Template directive: This page fetches a single entry from the 'blog' collection -->
        <!-- {get entry from 'blog' where slug='{{ slug }}'} -->
        <article class="post">
            <h1>{{ title }}</h1>
            <div class="post-meta">
                <time>{{ created_at|date:"F j, Y" }}</time>
                {if tags exist}
                <div class="tags">
                    {foreach tags as tag}
                    <span class="tag">{{ tag }}</span>
                    {endforeach}
                </div>
                {endif}
            </div>
            <div class="post-content">
                {{ content|raw }}
            </div>
            <nav class="post-navigation">
                <a href="/demo-blog/index.html">← Back to Blog</a>
            </nav>
        </article>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ site_title }} {{ current_year }}</p>
        </div>
    </footer>

    <!-- HaruCMS Client Library - That's it! Just one script tag. -->
    <!-- The template explicitly specifies the 'blog' collection to fetch from -->
    <!-- {get entry from 'blog' where slug='{{ slug }}'} -->
    <!-- In production: <script src="https://your-cms-domain.com/harucms-client.js"></script> -->
    <script src="/harucms-client.js" data-cms-url="http://localhost:8080" data-collection="blog"></script>
</body>
</html>
