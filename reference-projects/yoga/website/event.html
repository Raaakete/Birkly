<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="birkly-page" content="event">
    <meta name="birkly-collection" content="events">
    <title>{ title } — Stillwater Yoga</title>
    <link rel="stylesheet" href="/reference-projects/yoga/website/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/reference-projects/yoga/website/index.html">Stillwater Yoga</a></h1>
            <nav>
                <a href="/reference-projects/yoga/website/index.html">Upcoming</a>
                <a href="/reference-projects/yoga/website/schedule.html">Schedule</a>
            </nav>
        </div>
    </header>

    <main>
        <article class="event-detail container">
            <h1>{ title }</h1>
            <p class="meta">
                {if entry has 'start'}{ start }{endif}
                {if entry has 'venue'} · { venue }{endif}
                {if entry has 'capacity'} · { capacity } spots{endif}
            </p>
            <div class="content">
                { description }
            </div>
            <section class="event-register" style="margin-top: 2rem; padding: 1.25rem; border: 1px solid #e2e8f0; border-radius: 8px; max-width: 420px;">
                <h2 style="font-size: 1.1rem; margin: 0 0 1rem;">Register for this class</h2>
                <form
                    data-birkly-route="events"
                    data-birkly-action="rsvp"
                    data-birkly-success="redirect"
                    data-birkly-redirect="self"
                    data-birkly-ok-param="registered"
                >
                    <input type="hidden" name="event_id" value="{ slug }" />
                    <div class="form-group" style="margin-bottom: 0.75rem;">
                        <label for="rsvp-name">Your name</label>
                        <input id="rsvp-name" name="name" class="form-control" type="text" required autocomplete="name" style="width: 100%; padding: 0.5rem;" />
                    </div>
                    <div class="form-group" style="margin-bottom: 1rem;">
                        <label for="rsvp-email">Email</label>
                        <input id="rsvp-email" name="email" class="form-control" type="email" required autocomplete="email" style="width: 100%; padding: 0.5rem;" />
                    </div>
                    <button type="submit" class="btn">Complete registration</button>
                </form>
            </section>
            <p style="margin-top: 1rem;">
                <a href="/reference-projects/yoga/website/index.html">← Back to upcoming</a>
            </p>
        </article>
    </main>

    <footer>
        <p>&copy; Birkly Reference — Yoga</p>
    </footer>

    <script src="/birkly-client.js" data-cms-url="http://localhost:8080"></script>
</body>
</html>
