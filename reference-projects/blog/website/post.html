<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="birkly-page" content="post">
    <meta name="birkly-collection" content="blog">
    <title>{ title } — Birkly Blog</title>
    <link rel="stylesheet" href="/reference-projects/blog/website/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/reference-projects/blog/website/index.html">Birkly Blog</a></h1>
            <nav>
                <a href="/reference-projects/blog/website/index.html">Home</a>
                <a href="/reference-projects/blog/website/blog.html">Blog</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="post-detail">
            <div class="container">
                <article class="post">
                    <h1>{ title }</h1>
                    <div class="post-meta">
                        {if entry has created_at}
                        <time>{ created_at }</time>
                        {endif}
                        {if entry has 'tags'}
                        <div class="tags">
                            {for each item in 'tags'}
                            <span class="tag">{item}</span>
                            {endfor}
                        </div>
                        {endif}
                    </div>
                    <div class="post-content">
                        { content }
                    </div>
                    <nav class="post-navigation">
                        <a href="/reference-projects/blog/website/blog.html">← Back to Blog</a>
                    </nav>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; Birkly Reference — Blog</p>
        </div>
    </footer>

    <script src="/birkly-client.js" data-cms-url="http://localhost:8080"></script>
</body>
</html>
