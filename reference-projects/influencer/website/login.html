<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Maya Rivers</title>
    <link rel="stylesheet" href="/reference-projects/influencer/website/styles.css">
    <link rel="stylesheet" href="/reference-projects/influencer/website/social.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/reference-projects/influencer/website/index.html">Maya Rivers</a></h1>
        </div>
    </header>
    <main class="container" style="padding-top: 2rem; max-width: 480px;">
        <div class="card">
            <div class="card-body">
                <h2>Login</h2>
                <form
                    data-birkly-route="user_auth"
                    data-birkly-action="login"
                    data-birkly-success="redirect"
                    data-birkly-redirect="/reference-projects/influencer/website/index.html"
                >
                    <div class="form-group">
                        <label>Email</label>
                        <input name="email" class="form-control" type="email" required />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input name="password" class="form-control" type="password" required />
                    </div>
                    <button class="btn btn-primary" type="submit">Login</button>
                </form>
                <p style="margin-top: 1rem;"><a href="/reference-projects/influencer/website/register.html">Create account</a></p>
            </div>
        </div>
    </main>
    <script src="/birkly-client.js" data-cms-url="http://localhost:8080"></script>
</body>
</html>
