<link rel="stylesheet" href="{birkly_url '/admin/css/plugin-page.css'}">
<link rel="stylesheet" href="{birkly_url '/plugins/studio/admin/studio.css'}">

{plugin_page_header}

<div class="studio-ide plugin-page" id="studio-app">
  <div id="studio-dashboard" class="studio-dashboard">
    <div class="studio-toolbar">
      <h2>Studio projects</h2>
      <button type="button" class="btn btn-primary" id="studio-new-project">New project</button>
    </div>
    <div id="studio-project-list" class="studio-project-list"></div>
  </div>

  <div id="studio-workspace" class="studio-workspace" hidden>
    <header class="studio-ide-toolbar">
      <button type="button" class="btn btn-secondary btn-sm" id="studio-back">← Projects</button>
      <span id="studio-project-name" class="studio-project-name"></span>
      <div class="studio-ide-toolbar-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="studio-open-external" title="Open home page in new tab">Open project ↗</button>
        <button type="button" class="btn btn-secondary btn-sm" id="studio-export">Export</button>
        <button type="button" class="btn btn-primary btn-sm" id="studio-publish">Publish</button>
      </div>
    </header>

    <div class="studio-ide-body">
      <aside class="studio-sidebar" id="studio-sidebar">
        <div class="studio-sidebar-header">
          <strong>Files</strong>
          <button type="button" class="btn btn-secondary btn-sm" id="studio-refresh-tree" title="Refresh">↻</button>
        </div>
        <div id="studio-file-tree" class="studio-file-tree"></div>
        <div class="studio-sidebar-section">
          <strong>Sections</strong>
          <div id="studio-section-lib" class="studio-section-lib"></div>
        </div>
        <div class="studio-sidebar-section">
          <strong>Blocks</strong>
          <div id="studio-blocks" class="studio-blocks"></div>
        </div>
      </aside>

      <main class="studio-main">
        <div class="studio-tabbar" id="studio-tabbar" role="tablist"></div>
        <div class="studio-viewbar">
          <button type="button" class="studio-view-btn active" data-view="visual">Visual</button>
          <button type="button" class="studio-view-btn" data-view="code">Code</button>
          <button type="button" class="studio-view-btn" data-view="split">Split</button>
          <select id="studio-breakpoint" class="input studio-breakpoint-select" title="Breakpoint">
            <option value="default">Mobile</option>
            <option value="tablet">Tablet</option>
            <option value="desktop">Desktop</option>
          </select>
          <button type="button" class="btn btn-secondary btn-sm" id="studio-undo" title="Undo">Undo</button>
        </div>
        <div class="studio-editor-panes" id="studio-panes">
          <div class="studio-pane studio-pane-visual" id="studio-pane-visual">
            <div class="studio-canvas-toolbar">
              <button type="button" class="btn btn-secondary btn-sm" data-add="section">+ Section</button>
              <button type="button" class="btn btn-secondary btn-sm" data-add="text">Text</button>
              <button type="button" class="btn btn-secondary btn-sm" data-add="binding-loop">Blog loop</button>
            </div>
            <div id="studio-canvas" class="studio-canvas"></div>
          </div>
          <div class="studio-pane studio-pane-code" id="studio-pane-code" hidden>
            <div class="studio-code-wrap">
              <textarea id="studio-code-editor" class="studio-code-editor" spellcheck="false" aria-label="Code editor"></textarea>
            </div>
          </div>
        </div>
      </main>

      <aside class="studio-inspector" id="studio-inspector">
        <h3>Inspector</h3>
        <div id="studio-inspector-body"><p class="form-hint">Select an element</p></div>
        <h3>Design tokens</h3>
        <textarea id="studio-tokens-editor" class="studio-tokens-editor" spellcheck="false"></textarea>
        <button type="button" class="btn btn-secondary btn-sm" id="studio-save-tokens">Save tokens</button>
      </aside>
    </div>
  </div>

  <div id="studio-new-modal" class="studio-modal" hidden>
    <div class="studio-modal-backdrop" data-close-new></div>
    <div class="studio-modal-content studio-modal-sm">
      <h3>New project</h3>
      <label>Name <input type="text" id="studio-new-name" class="input"></label>
      <label>Style kit
        <select id="studio-new-kit" class="input">
          <option value="minimal">Minimal</option>
          <option value="bootstrap">Bootstrap</option>
          <option value="tailwind-lite">Tailwind Lite</option>
        </select>
      </label>
      <div class="studio-modal-actions">
        <button type="button" class="btn btn-secondary" data-close-new>Cancel</button>
        <button type="button" class="btn btn-primary" id="studio-create-project">Create</button>
      </div>
    </div>
  </div>
</div>

<script src="{birkly_url '/plugins/studio/admin/studio-ide.js'}"></script>
