<link rel="stylesheet" href="{birkly_url '/admin/css/plugin-page.css'}">
<link rel="stylesheet" href="{birkly_url '/plugins/studio/admin/studio.css'}">

{plugin_page_header}

<div class="studio-ide plugin-page" id="studio-app">
  <div id="studio-status" class="studio-status" hidden role="status"></div>

  <div id="studio-dashboard" class="studio-dashboard">
    <div class="studio-toolbar">
      <h2>Studio projects</h2>
      <button type="button" class="btn btn-primary" data-action="new-project">New project</button>
    </div>
    <div id="studio-project-list" class="studio-project-list"></div>
  </div>

  <div id="studio-workspace" class="studio-workspace" hidden>
    <header class="studio-ide-toolbar">
      <div class="studio-toolbar-group studio-toolbar-group-nav">
        <button type="button" class="btn btn-secondary btn-sm" data-action="back" title="Back to projects">← Projects</button>
        <span id="studio-project-name" class="studio-project-name"></span>
      </div>
      <div class="studio-toolbar-group studio-toolbar-group-file">
        <button type="button" class="btn btn-secondary btn-sm" data-action="save" title="Save (Ctrl+S)">Save</button>
        <button type="button" class="btn btn-secondary btn-sm" data-action="open-external" title="Open home page in new tab">Open ↗</button>
        <button type="button" class="btn btn-secondary btn-sm" data-action="export">Export</button>
      </div>
      <div class="studio-toolbar-group studio-toolbar-group-publish">
        <button type="button" class="btn btn-primary btn-sm" data-action="publish">Publish</button>
      </div>
    </header>

    <div class="studio-ide-body">
      <aside class="studio-sidebar" id="studio-sidebar">
        <div class="studio-panel-header">
          <strong>Files</strong>
          <div class="studio-sidebar-actions">
            <button type="button" class="btn btn-secondary btn-sm" data-action="new-page" title="New page">+ Page</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="refresh-tree" title="Refresh">↻</button>
          </div>
        </div>
        <div id="studio-file-tree" class="studio-file-tree"></div>

        <div class="studio-sidebar-section">
          <div class="studio-panel-header">
            <strong>Elements</strong>
          </div>
          <div class="studio-palette">
            <div class="studio-palette-group">
              <span class="studio-palette-label">Layout</span>
              <button type="button" class="studio-palette-btn" data-add="section">+ Section</button>
            </div>
            <div class="studio-palette-group">
              <span class="studio-palette-label">Content</span>
              <button type="button" class="studio-palette-btn" data-add="text">Text</button>
              <button type="button" class="studio-palette-btn" data-add="heading">Heading</button>
              <button type="button" class="studio-palette-btn" data-add="image">Image</button>
              <button type="button" class="studio-palette-btn" data-add="button">Button</button>
              <button type="button" class="studio-palette-btn" data-add="spacer">Spacer</button>
              <button type="button" class="studio-palette-btn" data-add="divider">Divider</button>
              <button type="button" class="studio-palette-btn" data-add="html">HTML block</button>
            </div>
            <div class="studio-palette-group">
              <span class="studio-palette-label">Bindings</span>
              <button type="button" class="studio-binding-card" data-action="open-binding-wizard" data-binding-type="loop">
                <span class="studio-binding-card-icon">⟳</span>
                <span class="studio-binding-card-body">
                  <strong>Collection loop</strong>
                  <small>List all entries</small>
                </span>
              </button>
              <button type="button" class="studio-binding-card" data-action="open-binding-wizard" data-binding-type="filtered">
                <span class="studio-binding-card-icon">⊘</span>
                <span class="studio-binding-card-body">
                  <strong>Filtered list</strong>
                  <small>Filter + order + limit</small>
                </span>
              </button>
              <button type="button" class="studio-binding-card" data-action="open-binding-wizard" data-binding-type="single">
                <span class="studio-binding-card-icon">1</span>
                <span class="studio-binding-card-body">
                  <strong>Single entry</strong>
                  <small>One entry by slug</small>
                </span>
              </button>
              <button type="button" class="studio-binding-card" data-action="open-binding-wizard" data-binding-type="site_element">
                <span class="studio-binding-card-icon">◇</span>
                <span class="studio-binding-card-body">
                  <strong>Site element</strong>
                  <small>Reusable block</small>
                </span>
              </button>
            </div>
          </div>
        </div>

        <div class="studio-sidebar-section">
          <div class="studio-panel-header"><strong>Sections</strong></div>
          <div id="studio-section-lib" class="studio-section-lib"></div>
        </div>
        <div class="studio-sidebar-section">
          <div class="studio-panel-header"><strong>Plugin blocks</strong></div>
          <div id="studio-blocks" class="studio-blocks"></div>
        </div>
      </aside>

      <main class="studio-main">
        <div class="studio-tabbar" id="studio-tabbar" role="tablist"></div>
        <div class="studio-viewbar">
          <div class="studio-viewbar-group">
            <span class="studio-viewbar-label">View</span>
            <button type="button" class="studio-view-btn active" data-view="visual">Visual</button>
            <button type="button" class="studio-view-btn" data-view="code">Code</button>
            <button type="button" class="studio-view-btn" data-view="split">Split</button>
          </div>
          <div class="studio-viewbar-group">
            <span class="studio-viewbar-label">Breakpoint</span>
            <select id="studio-breakpoint" class="input studio-breakpoint-select" title="Breakpoint">
              <option value="default">Mobile</option>
              <option value="tablet">Tablet</option>
              <option value="desktop">Desktop</option>
            </select>
          </div>
          <div class="studio-viewbar-group">
            <span class="studio-viewbar-label">Edit</span>
            <button type="button" class="btn btn-secondary btn-sm" data-action="undo" title="Undo">Undo</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="add-column" title="Add column to section">+ Col</button>
          </div>
          <div class="studio-viewbar-group">
            <span class="studio-viewbar-label">Section</span>
            <button type="button" class="btn btn-secondary btn-sm" data-action="dup-section" title="Duplicate section">Duplicate</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="move-section-up" title="Move section up">↑</button>
            <button type="button" class="btn btn-secondary btn-sm" data-action="move-section-down" title="Move section down">↓</button>
          </div>
        </div>
        <div class="studio-editor-panes" id="studio-panes">
          <div class="studio-pane studio-pane-visual" id="studio-pane-visual">
            <div id="studio-canvas" class="studio-canvas"></div>
          </div>
          <div class="studio-pane studio-pane-code" id="studio-pane-code" hidden>
            <div class="studio-code-wrap">
              <textarea id="studio-code-editor" class="studio-code-editor" spellcheck="false" aria-label="Code editor"></textarea>
            </div>
          </div>
        </div>
      </main>

      <aside class="studio-inspector" id="studio-inspector">
        <div class="studio-panel-header"><strong>Layers</strong></div>
        <div id="studio-layers" class="studio-layers"></div>

        <div class="studio-panel-header studio-inspector-tabs-header">
          <strong>Inspector</strong>
          <div class="studio-inspector-tabs" role="tablist">
            <button type="button" class="studio-insp-tab active" data-insp-tab="props" role="tab">Properties</button>
            <button type="button" class="studio-insp-tab" data-insp-tab="css" role="tab">CSS</button>
            <button type="button" class="studio-insp-tab" data-insp-tab="nav" role="tab">Nav</button>
          </div>
        </div>
        <div id="studio-inspector-body"><p class="form-hint">Select a section or element</p></div>

        <div class="studio-panel-header studio-tokens-header"><strong>Design tokens</strong></div>
        <textarea id="studio-tokens-editor" class="studio-tokens-editor" spellcheck="false"></textarea>
        <button type="button" class="btn btn-secondary btn-sm" data-action="save-tokens">Save tokens</button>
      </aside>
    </div>

    <footer class="studio-statusbar" id="studio-statusbar">
      <span id="studio-statusbar-hint" class="studio-statusbar-hint">SSR route: checking…</span>
      <span id="studio-statusbar-meta" class="studio-statusbar-meta"></span>
    </footer>
  </div>

  <div id="studio-new-modal" class="studio-modal" hidden>
    <div class="studio-modal-backdrop" data-action="close-new"></div>
    <div class="studio-modal-content studio-modal-sm">
      <h3>New project</h3>
      <label>Name <input type="text" id="studio-new-name" class="input"></label>
      <label>Style kit
        <select id="studio-new-kit" class="input">
          <option value="minimal">Minimal</option>
          <option value="bootstrap">Bootstrap</option>
          <option value="tailwind-lite">Tailwind Lite</option>
        </select>
      </label>
      <div class="studio-modal-actions">
        <button type="button" class="btn btn-secondary" data-action="close-new">Cancel</button>
        <button type="button" class="btn btn-primary" data-action="create-project">Create</button>
      </div>
    </div>
  </div>

  <div id="studio-binding-modal" class="studio-modal" hidden>
    <div class="studio-modal-backdrop" data-action="close-binding-wizard"></div>
    <div class="studio-modal-content studio-modal-md">
      <h3>Add binding</h3>
      <div class="studio-wizard-steps" id="studio-wizard-steps"></div>
      <div id="studio-wizard-body" class="studio-wizard-body"></div>
      <div class="studio-modal-actions">
        <button type="button" class="btn btn-secondary" data-action="wizard-prev" id="studio-wizard-prev" hidden>Back</button>
        <button type="button" class="btn btn-secondary" data-action="close-binding-wizard">Cancel</button>
        <button type="button" class="btn btn-primary" data-action="wizard-next" id="studio-wizard-next">Next</button>
      </div>
    </div>
  </div>
</div>

<script src="{birkly_url '/plugins/studio/admin/studio-ide.js'}"></script>
