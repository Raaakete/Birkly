<link rel="stylesheet" href="{birkly_url '/plugins/events/admin/events.css'}">

<div class="page-header pt-m pb-m">
  <div class="page-header-left">
    <div class="breadcrumbs">
      <a href="{admin_url 'settings'}">{translate 'admin.settings'}</a>
      <span class="separator">›</span>
      <span class="current">Events</span>
    </div>
  </div>
</div>

<div class="events-page">
  <div class="events-toolbar">
    <div>
      <h1 style="margin:0;font-size:1.5rem;font-weight:700">Events</h1>
      <p style="margin:0;color:var(--text-secondary);font-size:0.9375rem">Registrations, capacity, and paid tickets</p>
    </div>
    <div class="events-toolbar-actions">
      <a class="btn btn-secondary" href="{admin_url 'content'}?collection=events">Manage Events</a>
      <button class="btn btn-secondary" id="events-export-csv">Export CSV</button>
    </div>
  </div>

  <div class="events-filters">
    <select id="events-filter-event" class="input">
      <option value="">All events</option>
    </select>
    <button class="btn btn-secondary" id="events-refresh">Refresh</button>
  </div>

  <div id="events-registrations-list" class="events-registrations-list">
    <div class="loading-state"><p>Loading registrations…</p></div>
  </div>
</div>

<script src="{birkly_url '/plugins/events/admin/events.js'}"></script>
