<link rel="stylesheet" href="{birkly_url '/plugins/shopping_cart/admin/cart.css'}">

<div class="page-header pt-m pb-m">
  <div class="page-header-left">
    <div class="breadcrumbs">
      <a href="{admin_url 'settings'}">{translate 'admin.settings'}</a>
      <span class="separator">›</span>
      <span class="current">Shop</span>
    </div>
  </div>
</div>

<div class="shop-page">
  <div class="shop-toolbar">
    <div>
      <h1 style="margin:0;font-size:1.5rem;font-weight:700">Shopping Cart</h1>
      <p style="margin:0;color:var(--text-secondary);font-size:0.9375rem">Products, orders, and checkout settings</p>
    </div>
    <a class="btn btn-secondary" href="{admin_url 'content'}?collection=shop_products">Manage Products</a>
  </div>

  <div class="shop-tabs" role="tablist">
    <button class="shop-tab active" data-tab="orders" role="tab">Orders</button>
    <button class="shop-tab" data-tab="settings" role="tab">Settings</button>
  </div>

  <div id="shop-tab-orders" class="shop-tab-panel active" role="tabpanel">
    <div id="shop-orders-list" class="shop-orders-list">
      <div class="loading-state"><p>Loading orders…</p></div>
    </div>
  </div>

  <div id="shop-tab-settings" class="shop-tab-panel" role="tabpanel" hidden>
    <form id="shop-settings-form" class="shop-settings-form">
      <div class="form-group">
        <label for="shop-success-path">Checkout success path</label>
        <input type="text" id="shop-success-path" class="input" value="/shop/thank-you">
      </div>
      <div class="form-group">
        <label for="shop-cancel-path">Checkout cancel path</label>
        <input type="text" id="shop-cancel-path" class="input" value="/shop/cart">
      </div>
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
  </div>
</div>

<script src="{birkly_url '/plugins/shopping_cart/admin/cart.js'}"></script>
