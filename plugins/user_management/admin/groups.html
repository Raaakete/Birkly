<!-- Groups Management Page -->
<div class="page-header pt-m pb-m">
    <div class="page-header-left">
        <div class="breadcrumbs">
            <a href="/admin/index.php?page=dashboard">Dashboard</a>
            <span class="separator">›</span>
            <a href="/admin/index.php?page=site_users">Site Users</a>
            <span class="separator">›</span>
            <span class="current">Groups</span>
        </div>
    </div>
    <div class="page-header-actions">
        <button class="btn btn-primary" onclick="openAddGroupModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Create Group
        </button>
    </div>
</div>

<header class="content-header mb-3">
    <h2 class="h2 m-0">Group Management</h2>
    <div class="text-muted mt-1" style="font-size:1rem;">Manage user groups and team permissions</div>
</header>

<div class="row">
    <div class="col-md-12">
        <!-- Search and Filters -->
        <div class="card mb-3">
            <div class="card-body">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="search-groups">Search Groups</label>
                            <input type="text" id="search-groups" class="form-control" placeholder="Search by name..." onkeyup="handleSearch(event)">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="filter-type">Type</label>
                            <select id="filter-type" class="form-control" onchange="applyFilters()">
                                <option value="">All Types</option>
                                <option value="public">Public</option>
                                <option value="private">Private</option>
                                <option value="closed">Closed</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-secondary w-100" onclick="clearFilters()">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Groups Table -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="h4 m-0">Groups</h3>
            </div>
            <div class="card-body">
                <div id="groups-table-container">
                    <div class="text-center py-5">
                        <div class="spinner-border" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Group Detail Modal -->
<div id="group-modal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
            <h3 class="h3 m-0" id="group-modal-title">Create Group</h3>
            <button type="button" class="btn-close" onclick="closeGroupModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="group-form">
                <input type="hidden" id="group-id" name="id">
                
                <div class="form-group">
                    <label for="group-name">Group Name *</label>
                    <input type="text" id="group-name" name="name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="group-description">Description</label>
                    <textarea id="group-description" name="description" class="form-control" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="group-type">Type</label>
                    <select id="group-type" name="type" class="form-control">
                        <option value="private">Private (Invite only)</option>
                        <option value="public">Public (Anyone can join)</option>
                        <option value="closed">Closed (No new members)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Members</label>
                    <div id="group-members-list">
                        <p class="text-muted">Members can be added after group creation.</p>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeGroupModal()">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="saveGroup()">Save Group</button>
        </div>
    </div>
</div>

<script src="/plugins/user_management/admin/groups.js"></script>
<script>
// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    if (window.initGroupsManagement) {
        window.initGroupsManagement();
    }
});
</script>
