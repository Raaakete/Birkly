<header class="content-header mb-3">
  <h2 class="h2 m-0">Community Users</h2>
  <div class="text-muted mt-1" style="font-size:1rem;">Manage community user registrations and settings</div>
</header>

<div class="row">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h3 class="h4 m-0">User Management</h3>
        <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">
          <i class="icon-plus"></i> Add New User
        </button>
      </div>
      <div class="card-body">
        <div id="usersTable">
          <!-- Users table will be loaded here -->
        </div>
      </div>
    </div>
  </div>
  
  <div class="col-md-4">
    <div class="card">
      <div class="card-header">
        <h3 class="h4 m-0">Quick Stats</h3>
      </div>
      <div class="card-body">
        <div id="statsContainer">
          <!-- Stats will be loaded here -->
        </div>
      </div>
    </div>
    
    <div class="card mt-3">
      <div class="card-header">
        <h3 class="h4 m-0">Settings</h3>
      </div>
      <div class="card-body">
        <button class="btn btn-primary btn-sm" onclick="openPluginSettings()">
          <i class="icon-settings"></i> Configure Plugin Settings
        </button>
      </div>
    </div>
  </div>
</div>

<!-- User Modal -->
<div id="userModal" class="modal" style="display: none;">
  <div class="modal-content" style="max-width: 500px;">
    <div class="modal-header">
      <h3 id="userModalTitle">Add New User</h3>
      <span class="close" onclick="closeUserModal()">&times;</span>
    </div>
    <div class="modal-body">
      <form id="userForm">
        <input type="hidden" id="userId" name="id">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" required>
          <small class="text-muted">Leave blank to keep existing password when editing</small>
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" class="form-control">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="pending_verification">Pending Verification</option>
            <option value="pending_approval">Pending Approval</option>
          </select>
        </div>
        <div class="form-actions mt-3">
          <button type="submit" class="btn btn-primary">Save User</button>
          <button type="button" class="btn btn-secondary" onclick="closeUserModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/plugins/community_users/admin/community_users.js"></script>
