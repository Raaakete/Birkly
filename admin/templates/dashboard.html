<script>
// Dashboard data loading
(function() {
    const csrfToken = document.getElementById('csrf-token')?.value;
    
    // Escape HTML helper
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Load dashboard stats
    function loadStats() {
        fetch('/api/dashboard.php?action=stats')
            .then(r => r.json())
            .then(data => {
                if (data.status === 'ok' && data.data && data.data.stats) {
                    const stats = data.data.stats;
                    document.getElementById('stat-collections').textContent = stats.collections || '0';
                    document.getElementById('stat-total-entries').textContent = stats.total_entries || '0';
                    document.getElementById('stat-published').textContent = stats.published || '0';
                    document.getElementById('stat-drafts').textContent = stats.drafts || '0';
                } else {
                    // Fallback if no stats available
                    document.getElementById('stat-collections').textContent = '0';
                    document.getElementById('stat-total-entries').textContent = '0';
                    document.getElementById('stat-published').textContent = '0';
                    document.getElementById('stat-drafts').textContent = '0';
                }
            })
            .catch(err => {
                console.error('Error loading stats:', err);
                // Show 0 values on error
                document.getElementById('stat-collections').textContent = '0';
                document.getElementById('stat-total-entries').textContent = '0';
                document.getElementById('stat-published').textContent = '0';
                document.getElementById('stat-drafts').textContent = '0';
            });
    }
    
    
    // Load recent collections (from content API)
    function loadRecentCollections() {
        const collectionsList = document.getElementById('recent-collections-list');
        if (!collectionsList) return;
        
        fetch('/api/content.php?action=list_collections')
            .then(r => r.json())
            .then(data => {
                // Handle different response formats
                let collections = [];
                if (data.status === 'ok' && data.data && data.data.collections && Array.isArray(data.data.collections)) {
                    collections = data.data.collections;
                } else if (data.status === 'ok' && data.data && Array.isArray(data.data)) {
                    collections = data.data;
                } else if (Array.isArray(data)) {
                    collections = data;
                } else if (data.data && Array.isArray(data.data)) {
                    collections = data.data;
                }
                
                // Sort by most recently modified (if available) or by name
                collections.sort((a, b) => {
                    const dateA = a.modified_at || a.updated_at || a.created_at || 0;
                    const dateB = b.modified_at || b.updated_at || b.created_at || 0;
                    if (dateA && dateB) {
                        return new Date(dateB) - new Date(dateA);
                    }
                    const nameA = (a.name || a.title || a.slug || '').toLowerCase();
                    const nameB = (b.name || b.title || b.slug || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });
                
                const recentCollections = collections.slice(0, 5); // Show first 5
                    
                if (recentCollections.length === 0) {
                    collectionsList.innerHTML = '<p class="empty-state"><?= __('admin.no_collections_found') ?></p>';
                    return;
                }
                    
                collectionsList.innerHTML = recentCollections.map(collection => {
                        const name = collection.name || collection.title || collection.slug || 'Untitled';
                        const entriesCount = collection.total_entries || collection.entries_count || 0;
                        const slug = collection.slug || '';
                        
                        return `
                        <div class="collection-item">
                            <div class="collection-info">
                                    <h4>${escapeHtml(name)}</h4>
                                    <p>${entriesCount} ${entriesCount === 1 ? '<?= __('admin.entry') ?>' : '<?= __('admin.entries') ?>'}</p>
                                </div>
                                <a class="btn btn-sm" href="${(window.Birkly && Birkly.adminUrl) ? Birkly.adminUrl('entries', {collection: slug}) : '/admin/index.php?page=entries&collection=' + encodeURIComponent(slug)}"><?= __('admin.view') ?></a>
                            </div>
                        `;
                    }).join('');
            })
            .catch(err => {
                console.error('Error loading collections:', err);
                collectionsList.innerHTML = '<p class="empty-state error"><?= __('admin.error_loading_data') ?></p>';
            });
    }
    
    // Escape HTML helper
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Onboarding modal handlers
    const onboardingModal = document.getElementById('onboarding-complete-modal');
    const closeModal = () => {
        if (onboardingModal) onboardingModal.style.display = 'none';
    };
    
    document.getElementById('onboarding-complete-close')?.addEventListener('click', closeModal);
    document.getElementById('onboarding-complete-close-btn')?.addEventListener('click', closeModal);
    
    // Check if onboarding just completed
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('onboarding_complete') === 'true' && onboardingModal) {
        onboardingModal.style.display = 'flex';
        const demoUrl = urlParams.get('demo_website_url');
        const demoCard = document.getElementById('onboarding-complete-demo-card');
        const demoLink = document.getElementById('onboarding-complete-demo-link');
        if (demoUrl && demoCard && demoLink) {
            demoCard.style.display = '';
            demoLink.href = demoUrl;
        }
    }

    async function postOnboardingAction(action, body) {
        const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
        const res = await fetch((window.Birkly && Birkly.url) ? Birkly.url('/api/onboarding.php?action=' + action) : '/api/onboarding.php?action=' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, _csrf: csrf })
        });
        return res.json();
    }

    document.getElementById('hide-checklist-btn')?.addEventListener('click', async () => {
        await postOnboardingAction('hide_checklist', {});
        document.getElementById('onboarding-checklist-panel')?.remove();
    });

    document.querySelectorAll('.checklist-dismiss').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.preventDefault();
            const id = btn.getAttribute('data-dismiss-id');
            if (!id) return;
            await postOnboardingAction('dismiss_checklist_item', { item_id: id });
            btn.closest('.checklist-item')?.remove();
        });
    });
    
    // Load dashboard data on page load
    loadStats();
    <?php if (!$showOnboarding): ?>
    loadRecentCollections();
    <?php endif; ?>
})();
</script>
