<script>
document.addEventListener('DOMContentLoaded', function() {
    // Auto-generate slug from name
    const nameField = document.getElementById('name');
    const slugField = document.getElementById('slug');
    
    if (nameField && slugField) {
        nameField.addEventListener('input', function() {
            if (!slugField.value || slugField.dataset.autoGenerated === 'true') {
                const slug = nameField.value
                    .toLowerCase()
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-')
                    .trim('-');
                slugField.value = slug;
                slugField.dataset.autoGenerated = 'true';
            }
        });
        
        slugField.addEventListener('input', function() {
            slugField.dataset.autoGenerated = 'false';
        });
    }
    
    // Add field functionality
    const addFieldBtn = document.getElementById('add-field-btn');
    const fieldsContainer = document.getElementById('fields-container');
    
    function getNextFieldIndex() {
        const existingFields = fieldsContainer.querySelectorAll('.field-definition');
        let maxIndex = -1;
        existingFields.forEach(function(field) {
            const indexAttr = field.getAttribute('data-index');
            if (indexAttr !== null) {
                const idx = parseInt(indexAttr, 10);
                if (!isNaN(idx) && idx > maxIndex) {
                    maxIndex = idx;
                }
            }
        });
        return maxIndex + 1;
    }
    
    addFieldBtn.addEventListener('click', function() {
        const fieldIndex = getNextFieldIndex();
        const fieldDefinition = document.createElement('div');
        fieldDefinition.className = 'field-definition';
        fieldDefinition.setAttribute('data-index', fieldIndex);
        
        // Get available fieldtypes from PHP
        const availableFieldtypes = <?= json_encode($fieldtypes ?? []) ?>;
        
        let fieldtypeOptions = '';
        availableFieldtypes.forEach(function(ft) {
            fieldtypeOptions += `<option value="${ft.name}">${ft.label}</option>`;
        });
        
        fieldDefinition.innerHTML = `
            <div class="field-definition-header">
                <input type="text" name="fields[${fieldIndex}][name]" placeholder="Field name" class="field-name-input" required>
                <select name="fields[${fieldIndex}][type]" class="field-type-select" required>
                    <option value="">Select type...</option>
                    ${fieldtypeOptions}
                </select>
                <button type="button" class="btn-icon remove-field-btn" title="Remove field">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3,6 5,6 21,6"></polyline>
                        <path d="M19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
                    </svg>
                </button>
            </div>
            <div class="field-definition-body">
                <input type="text" name="fields[${fieldIndex}][label]" placeholder="Field label" class="field-label-input">
                <label class="checkbox-label">
                    <input type="checkbox" name="fields[${fieldIndex}][required]" value="1">
                    <span>Required</span>
                </label>
                <div class="fieldtype-config" data-field-index="${fieldIndex}" style="display: none;">
                    <!-- Fieldtype-specific configuration will be loaded here -->
                </div>
            </div>
        `;
        
        fieldsContainer.appendChild(fieldDefinition);
        
        // Add listener for fieldtype change to load configuration UI
        const typeSelect = fieldDefinition.querySelector('.field-type-select');
        typeSelect.addEventListener('change', function() {
            loadFieldtypeConfig(fieldIndex, this.value);
        });
    });
    
    // Load fieldtype-specific configuration UI
    function loadFieldtypeConfig(fieldIndex, fieldtype) {
        const configContainer = document.querySelector(`[data-field-index="${fieldIndex}"]`);
        if (!configContainer || !fieldtype) {
            return;
        }
        
        // For now, show/hide based on fieldtype
        // In the future, this can load specific config UI via AJAX
        if (fieldtype === 'select') {
            configContainer.style.display = 'block';
            configContainer.innerHTML = `
                <div class="field-config-section">
                    <label>Options (one per line, format: label|value)</label>
                    <textarea name="fields[${fieldIndex}][options_text]" class="input" rows="4" placeholder="Option 1|value1&#10;Option 2|value2"></textarea>
                    <small>Or leave empty to configure later</small>
                </div>
            `;
        } else {
            configContainer.style.display = 'none';
            configContainer.innerHTML = '';
        }
    }
    
    // Attach fieldtype change listeners to existing fields
    document.querySelectorAll('.field-type-select').forEach(function(select) {
        const fieldDefinition = select.closest('.field-definition');
        if (fieldDefinition) {
            const fieldIndex = fieldDefinition.getAttribute('data-index');
            select.addEventListener('change', function() {
                loadFieldtypeConfig(fieldIndex, this.value);
            });
            // Load config if fieldtype is already selected
            if (select.value) {
                loadFieldtypeConfig(fieldIndex, select.value);
            }
        }
    });
    
    // Remove field functionality
    fieldsContainer.addEventListener('click', function(e) {
        if (e.target.closest('.remove-field-btn')) {
            e.target.closest('.field-definition').remove();
        }
    });
    
    // Form submission
    const form = document.getElementById('collection-form');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            fetch('/api/admin_collections.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    // Redirect to content page
                    window.location.href = '/admin/index.php?page=content';
                } else {
                    alert('Error: ' + (data.message || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error saving collection: ' + error.message);
            });
        });
    }
});
</script>
