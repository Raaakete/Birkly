<script>
let roles = [];
let availableResources = ['collections', 'media', 'users', 'settings'];
let availableActions = ['view', 'edit', 'create', 'delete'];

// Get CSRF token
function getCsrfToken() {
    const metaToken = document.querySelector('meta[name="csrf-token"]');
    return metaToken ? metaToken.getAttribute('content') : '';
}

// Load roles
async function loadRoles() {
    try {
        const response = await fetch('/api/roles.php?action=list_roles');
        const result = await response.json();
        
        if (result.status === 'ok') {
            roles = result.roles || [];
            renderRoles();
        } else {
            showMessage('Error loading roles: ' + result.message, 'error');
        }
    } catch (error) {
        console.error('Error loading roles:', error);
        showMessage('Error loading roles: ' + error.message, 'error');
    }
}

// Render roles grid
function renderRoles() {
    const grid = document.getElementById('roles-grid');
    
    if (roles.length === 0) {
        grid.innerHTML = `
            <div class="empty-state">
                <p>No roles found.</p>
                <button class="btn btn-primary" onclick="openAddRoleModal()">Add First Role</button>
            </div>
        `;
        return;
    }
    
    grid.innerHTML = roles.map(role => `
        <div class="role-card">
            <div class="role-header">
                <h3>${escapeHtml(role.name)}</h3>
                <div class="role-actions">
                    <button class="btn-icon" onclick="editRole('${role.id}')" title="Edit Role">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>
                    <button class="btn-icon danger" onclick="confirmDeleteRole('${role.id}', '${escapeHtml(role.name)}')" title="Delete Role">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3,6 5,6 21,6"></polyline>
                            <path d="M19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="role-description">${escapeHtml(role.description)}</p>
            <div class="role-permissions">
                ${renderRolePermissions(role.permissions)}
            </div>
        </div>
    `).join('');
}

// Render role permissions
function renderRolePermissions(permissions) {
    if (!permissions) return '<p class="text-muted">No permissions defined</p>';
    
    const items = [];
    for (const [resource, actions] of Object.entries(permissions)) {
        if (Array.isArray(actions)) {
            items.push(`
                <div class="permission-item">
                    <span class="resource">${resource === '*' ? 'All Resources' : resource}</span>
                    <span class="actions">${actions.join(', ')}</span>
                </div>
            `);
        }
    }
    
    return items.length > 0 ? items.join('') : '<p class="text-muted">No permissions defined</p>';
}

// Create permissions grid
function createPermissionsGrid(containerId, permissions = {}) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    availableResources.forEach(resource => {
        const section = document.createElement('div');
        section.className = 'permission-section';
        
        section.innerHTML = `
            <h4>${resource}</h4>
            <div class="permission-checkboxes">
                ${availableActions.map(action => `
                    <label class="checkbox-label">
                        <input type="checkbox" name="permissions[${resource}][]" value="${action}" 
                               ${hasPermission(permissions, resource, action) ? 'checked' : ''}>
                        <span>${action}</span>
                    </label>
                `).join('')}
            </div>
        `;
        
        container.appendChild(section);
    });
}

// Check if role has specific permission
function hasPermission(permissions, resource, action) {
    if (!permissions) return false;
    
    // Check wildcard permissions
    if (permissions['*'] && permissions['*'].includes(action)) {
        return true;
    }
    
    // Check specific resource permissions
    if (permissions[resource] && permissions[resource].includes(action)) {
        return true;
    }
    
    return false;
}

// Collect permissions from form
function collectPermissions(form) {
    const permissions = {};
    
    availableResources.forEach(resource => {
        const checkboxes = form.querySelectorAll(`input[name="permissions[${resource}][]"]:checked`);
        if (checkboxes.length > 0) {
            permissions[resource] = Array.from(checkboxes).map(cb => cb.value);
        }
    });
    
    return permissions;
}

// Utility functions
function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(tag) {
        const chars = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'};
        return chars[tag] || tag;
    });
}

function showMessage(message, type) {
    let messageDiv = document.getElementById('role-message');
    if (!messageDiv) {
        messageDiv = document.createElement('div');
        messageDiv.id = 'role-message';
        messageDiv.className = 'message ' + type;
        document.querySelector('.roles-page').insertBefore(messageDiv, document.querySelector('.main-actions-bar'));
    }
    
    messageDiv.textContent = message;
    messageDiv.className = 'message ' + type;
    messageDiv.style.display = 'block';
    
    setTimeout(() => {
        messageDiv.style.display = 'none';
    }, 5000);
}

// Modal functions
function openAddRoleModal() {
    document.getElementById('add-role-modal').classList.add('active');
    document.getElementById('add-role-form').reset();
    createPermissionsGrid('add-permissions-grid');
}

function closeAddRoleModal() {
    document.getElementById('add-role-modal').classList.remove('active');
}

function openEditRoleModal() {
    document.getElementById('edit-role-modal').classList.add('active');
}

function closeEditRoleModal() {
    document.getElementById('edit-role-modal').classList.remove('active');
}

// Role management functions
async function createRole() {
    const form = document.getElementById('add-role-form');
    const formData = new FormData(form);
    
    const roleData = {
        action: 'create_role',
        role: {
            id: formData.get('name').toLowerCase().replace(/[^a-z0-9]/g, '-'),
            name: formData.get('name'),
            description: formData.get('description'),
            permissions: collectPermissions(form)
        },
        _csrf: getCsrfToken()
    };
    
    try {
        const response = await fetch('/api/roles.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(roleData)
        });
        
        const result = await response.json();
        
        if (result.status === 'ok') {
            showMessage('Role created successfully!', 'success');
            closeAddRoleModal();
            loadRoles();
        } else {
            showMessage('Error: ' + result.message, 'error');
        }
    } catch (error) {
        showMessage('Error creating role: ' + error.message, 'error');
    }
}

function editRole(roleId) {
    const role = roles.find(r => r.id === roleId);
    if (!role) return;
    
    document.getElementById('edit-role-id').value = role.id;
    document.getElementById('edit-role-name').value = role.name;
    document.getElementById('edit-role-description').value = role.description || '';
    
    createPermissionsGrid('edit-permissions-grid', role.permissions);
    openEditRoleModal();
}

async function updateRole() {
    const form = document.getElementById('edit-role-form');
    const formData = new FormData(form);
    
    const roleData = {
        action: 'update_role',
        role: {
            id: formData.get('id'),
            name: formData.get('name'),
            description: formData.get('description'),
            permissions: collectPermissions(form)
        },
        _csrf: getCsrfToken()
    };
    
    try {
        const response = await fetch('/api/roles.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(roleData)
        });
        
        const result = await response.json();
        
        if (result.status === 'ok') {
            showMessage('Role updated successfully!', 'success');
            closeEditRoleModal();
            loadRoles();
        } else {
            showMessage('Error: ' + result.message, 'error');
        }
    } catch (error) {
        showMessage('Error updating role: ' + error.message, 'error');
    }
}

function confirmDeleteRole(roleId, roleName) {
    if (confirm(`Are you sure you want to delete role "${roleName}"? This action cannot be undone.`)) {
        deleteRole(roleId);
    }
}

async function deleteRole(roleId) {
    const roleData = {
        action: 'delete_role',
        id: roleId,
        _csrf: getCsrfToken()
    };
    
    try {
        const response = await fetch('/api/roles.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(roleData)
        });
        
        const result = await response.json();
        
        if (result.status === 'ok') {
            showMessage('Role deleted successfully!', 'success');
            closeEditRoleModal();
            loadRoles();
        } else {
            showMessage('Error: ' + result.message, 'error');
        }
    } catch (error) {
        showMessage('Error deleting role: ' + error.message, 'error');
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    loadRoles();
});
</script>
