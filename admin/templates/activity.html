<div class="settings-shell activity-shell" data-birch>
<div class="page-header">
    <div class="page-header-left">
        <div class="breadcrumbs">
            <a href="{admin_url 'dashboard'}">{translate 'admin.dashboard'}</a>
            <span class="separator">›</span>
            <span class="current">{translate 'admin.activity'}</span>
        </div>
    </div>
    <div class="page-header-actions"></div>
</div>

<div class="activity-page">
    <div class="main-actions-bar">
        <div class="main-actions-left">
            <button class="btn btn-secondary" id="refresh-activity"><?= birkly_icon('refresh') ?>{translate 'admin.refresh'}</button>
        </div>
        <div class="main-actions-right u-nowrap-flex activity-page-filters">
            <select id="category-filter" class="input u-w-auto">
                <option value="all">{translate 'admin.all_activity'}</option>
                <option value="content">{translate 'admin.content'}</option>
                <option value="users">{translate 'admin.users'}</option>
                <option value="system">{translate 'admin.system'}</option>
            </select>
            <select id="severity-filter" class="input u-w-auto" aria-label="{translate 'admin.activity_severity'}">
                <option value="all">{translate 'admin.activity_all_severities'}</option>
                <option value="info">{translate 'admin.activity_severity_info'}</option>
                <option value="success">{translate 'admin.activity_severity_success'}</option>
                <option value="warning">{translate 'admin.activity_severity_warning'}</option>
                <option value="danger">{translate 'admin.activity_severity_danger'}</option>
            </select>
        </div>
    </div>

    <div class="page-body activity-body">
        <div id="activity-feed" class="activity-feed">
            <div class="loading-state">
                <p>{translate 'admin.loading_activity'}...</p>
            </div>
        </div>

        <div class="u-center">
            <button class="btn btn-secondary" id="load-more" hidden>{translate 'admin.load_more'}</button>
        </div>
    </div>
</div>

</div>
{include_script 'activity.js'}
