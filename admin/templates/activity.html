<!-- Activity Feed Page -->
<div class="page-header pt-m pb-m">
    <div class="page-header-left">
        <div class="breadcrumbs">
            <a href="{admin_url 'dashboard'}">{translate 'admin.dashboard'}</a>
            <span class="separator">›</span>
            <span class="current">{translate 'admin.activity'}</span>
        </div>
    </div>
    <div class="page-header-actions"></div>
</div>

<div class="activity-page">
    <div class="main-actions-bar">
        <div class="collection-actions-bar">
        <div class="collection-actions-bar-left">
            <button class="btn btn-secondary" id="refresh-activity">{translate 'admin.refresh'}</button>
        </div>
        <div class="collection-actions-bar-right">
            <select id="category-filter" class="input">
                <option value="all">{translate 'admin.all_activity'}</option>
                <option value="content">{translate 'admin.content'}</option>
                <option value="users">{translate 'admin.users'}</option>
                <option value="system">{translate 'admin.system'}</option>
            </select>
        </div>
        </div>
    </div>
    
    <div class="activity-feed" id="activity-feed">
        <div class="text-center">
            <div class="spinner">{translate 'admin.loading_activity'}...</div>
        </div>
    </div>
    
    <div class="pagination">
        <button class="btn btn-secondary" id="load-more" style="display: none;">{translate 'admin.load_more'}</button>
    </div>
</div>

<!-- Initialize Activity JavaScript (M3-T4: no inline logic in template) -->
{include_script 'activity.js'}
