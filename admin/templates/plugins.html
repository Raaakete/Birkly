<!-- Install Plugin Modal (local zip/url — legacy) -->
<div id="install-plugin-modal" class="modal-backdrop">

            <button class="modal-close-btn" type="button" onclick="PluginsPage.closeInstallModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p class="form-help"><?= __('admin.marketplace_install_hint') ?></p>
            <form id="install-plugin-form">
                <div class="form-group">
                    <label for="plugin-url"><?= __('admin.plugin_url_or_zip') ?></label>
                    <input type="url" id="plugin-url" name="plugin_url" class="input" placeholder="https://example.com/plugin.zip">
                    <small class="form-help"><?= __('admin.plugin_url_help') ?></small>
                </div>
                <div class="form-group">
                    <label for="plugin-file"><?= __('admin.or_upload_plugin_file') ?></label>
                    <input type="file" id="plugin-file" name="plugin_file" accept=".zip" class="input">

        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="PluginsPage.closeInstallModal()"><?= __('admin.cancel') ?></button>
