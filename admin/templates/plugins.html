<!-- Install Plugin Modal -->
<div id="install-plugin-modal" class="modal-backdrop">
    <div class="modal-content">
        <div class="modal-header">
            <h2><?= __('admin.install_plugin') ?></h2>
            <button class="modal-close-btn" onclick="closeInstallPluginModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="install-plugin-form">
                <div class="form-group">
                    <label for="plugin-url"><?= __('admin.plugin_url_or_zip') ?></label>
                    <input type="url" id="plugin-url" name="plugin_url" class="input" placeholder="https://example.com/plugin.zip">
                    <small class="form-help"><?= __('admin.plugin_url_help') ?></small>
                </div>
                <div class="form-group">
                    <label for="plugin-file"><?= __('admin.or_upload_plugin_file') ?></label>
                    <input type="file" id="plugin-file" name="plugin_file" accept=".zip" class="input">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closeInstallPluginModal()"><?= __('admin.cancel') ?></button>
            <button type="button" class="btn btn-primary" onclick="installPlugin()"><?= __('admin.install_plugin') ?></button>
        </div>
    </div>
</div>

<!-- Plugin Settings Modal -->
<div id="plugin-settings-modal" class="modal-backdrop">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="plugin-settings-title"><?= __('admin.plugin_settings') ?></h2>
            <button class="modal-close-btn" onclick="closePluginSettingsModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="plugin-settings-form">
                <input type="hidden" id="plugin-settings-id" name="plugin_id">
                <div id="plugin-settings-fields">
                    <!-- Settings fields will be populated by JavaScript -->
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="closePluginSettingsModal()"><?= __('admin.cancel') ?></button>
            <button type="button" class="btn btn-primary" onclick="savePluginSettings()"><?= __('admin.save_settings') ?></button>
        </div>
    </div>
</div>

<!-- Plugin Permissions Modal -->
<div id="plugin-permissions-modal" class="modal-backdrop">
