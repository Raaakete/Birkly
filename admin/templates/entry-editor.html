<script>
// Auto-generate slug from title
document.addEventListener('DOMContentLoaded', function() {
    const titleField = document.getElementById('field_title');
    const slugField = document.getElementById('slug');
    
    if (titleField && slugField) {
        titleField.addEventListener('input', function() {
            if (!slugField.value || slugField.dataset.autoGenerated === 'true') {
                const slug = titleField.value
                    .toLowerCase()
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-')
                    .trim('-');
                slugField.value = slug;
                slugField.dataset.autoGenerated = 'true';
            }
        });
        
        slugField.addEventListener('input', function() {
            slugField.dataset.autoGenerated = 'false';
        });
    }
    
    // Form submission
    const form = document.getElementById('entry-form');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            fetch('/api/admin_entries.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    // Redirect to entries list
                    window.location.href = '/admin/index.php?page=entries&collection=<?= htmlspecialchars($collection['slug'] ?? '') ?>';
                } else {
                    alert('Error: ' + (data.message || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error saving entry: ' + error.message);
            });
        });
    }
});
</script>
