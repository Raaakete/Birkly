<!-- Audit Log Page -->
<div class="page-header pt-m pb-m">
    <div class="page-header-left">
        <div class="breadcrumbs">
            <a href="{admin_url 'dashboard'}">{translate 'admin.dashboard'}</a>
            <span class="separator">›</span>
            <span class="current">{translate 'admin.audit_log'}</span>
        </div>
    </div>
    <div class="page-header-actions"></div>
</div>

<div class="audit-log-page">
    <div class="page-header">
        <h1>{translate 'admin.audit_log'}</h1>
    </div>
    
    <div class="main-actions-bar">
        <div class="filters">
            <select id="event-filter" class="input">
                <option value="">{translate 'admin.all_events'}</option>
            </select>
            <input type="date" id="date-filter" class="input" placeholder="{translate 'admin.filter_by_date'}">
            <button class="btn btn-secondary" id="refresh-logs">{translate 'admin.refresh'}</button>
        </div>
    </div>
    
    <div class="table-container">
        <table class="table" id="audit-log-table">
            <thead>
                <tr>
                    <th>{translate 'admin.timestamp'}</th>
                    <th>{translate 'admin.user'}</th>
                    <th>{translate 'admin.event'}</th>
                    <th>{translate 'admin.ip_address'}</th>
                    <th>{translate 'admin.details'}</th>
                </tr>
            </thead>
            <tbody id="log-entries">
                <tr>
                    <td colspan="5" class="text-center">
                        <div class="spinner">{translate 'admin.loading'}...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <div class="pagination">
        <button class="btn btn-secondary" id="load-more" style="display: none;">{translate 'admin.load_more'}</button>
    </div>
</div>

<!-- Initialize Audit Log JavaScript -->
{include_script 'audit-log.js'}

<script>
// Expose data for JavaScript
window.auditLogData = {
    csrfToken: '{csrf_token}'
};

// Initialize audit log when DOM is ready
document.addEventListener('DOMContentLoaded', function() {
    if (window.initAuditLog) {
        window.initAuditLog(window.auditLogData);
    }
});
</script>
