; Production PHP — log errors, never print to HTTP response
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Settings → Media allows up to 100MB. Keep PHP above that, including multipart overhead.
; nginx client_max_body_size is 128m.
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
