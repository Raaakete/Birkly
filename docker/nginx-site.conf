server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /app;
    index index.php;

    client_max_body_size 128m;

    # Never serve internal folders directly (media/ is public uploads)
    location ~ ^/(core|settings|users|content|data|cache|logs|scripts|tests)(/|$) {
        deny all;
    }

    # Git metadata is never web-readable — project/.git holds the managed
    # worktree used by Settings → Project → Git sync.
    location ~ /\.git {
        deny all;
    }

    # The /project/ alias below is a `^~` prefix location, so the regex above
    # never runs for it. This longer prefix wins instead.
    location ^~ /project/.git {
        deny all;
    }

    # MCP OAuth + connector routes (P4.1 — nginx does not read .htaccess)
    location = /favicon.ico {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/\.well-known/oauth-protected-resource(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/oauth_protected_resource.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /.well-known/oauth-authorization-server {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/oauth_authorization_server.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /.well-known/brand-context.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/well_known_brand_context.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /.well-known/agent-guide.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/well_known_agent_guide.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /authorize {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/oauth_authorize.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /oauth/authorize {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/oauth_authorize.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /oauth/token {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/oauth_token.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /oauth/register {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/oauth_register.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /mcp {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/mcp.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Avoid 403 on / when only index.php exists (directory listing disabled)
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Homepage must always reach PHP SSR — never a stray static /app/index.html.
    location = /index.html {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Project HTML needs SSR when enabled — static alias would skip PHP.
    location ~ ^/project/.+\.html$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Legacy /project/ path — static files; clean URLs on public host are handled in index.php
    # Fingerprinted assets use ?v= — safe to cache for a week (repeat visits / PSI cache policy).
    location ^~ /project/ {
        alias /app/project/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri $uri/ =404;
    }

    # Core public runtimes — immutable when versioned (?v=); gzip_static serves .gz.
    location = /birkly-client.js {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /birkly-webmcp.js {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /birkly-components.js {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Admin assets — always revalidate so deploys pick up JS/CSS without stale cache
    location ^~ /admin/js/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /admin/css/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/api/ai_chat\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300s;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
