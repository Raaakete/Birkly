server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /app;
    index index.php;

    client_max_body_size 128m;

    # Never serve internal folders directly (media/ is public uploads)
    location ~ ^/(core|settings|users|content|data|cache|logs|scripts|tests)(/|$) {
        deny all;
    }

    location ~ ^/project/.+\.html$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/serve_project_page.php;
        fastcgi_param BIRKLY_PAGE_PATH $uri;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
