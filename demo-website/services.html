<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - HaruCMS</title>
    <link rel="stylesheet" href="/demo-website/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/demo-website/index.html">HaruCMS</a></h1>
            <nav>
                <a href="/demo-website/index.html">Home</a>
                <a href="/demo-website/services.html" class="active">Services</a>
                <a href="/demo-website/about.html">About</a>
                <a href="/demo-website/contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Our Services</h1>
                <p class="page-subtitle">Professional solutions tailored to your needs</p>
            </div>
        </section>

        <section class="services-full">
            <div class="container">
                <div class="services-grid">
                    {for each entry in 'services'}
                    {if entry.status == 'published'}
                    <div class="service-card {if entry.featured == true}featured{endif}">
                        <div class="service-icon">{ icon }</div>
                        <h3>{ title }</h3>
                        <p class="service-description">{ description }</p>
                        {if entry has price}
                        <p class="service-price">{ price }</p>
                        {endif}
                    </div>
                    {endif}
                    {endfor}
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; HaruCMS { current_year }</p>
        </div>
    </footer>

    <script src="/harucms-client.js" data-cms-url="http://localhost:8080"></script>
</body>
</html>
