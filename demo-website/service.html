<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{ title } - HaruCMS</title>
    <link rel="stylesheet" href="/demo-website/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/demo-website/index.html">HaruCMS</a></h1>
            <nav>
                <a href="/demo-website/index.html">Home</a>
                <a href="/demo-website/services.html">Services</a>
                <a href="/demo-website/blog.html">Blog</a>
                <a href="/demo-website/about.html">About</a>
                <a href="/demo-website/contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="service-detail">
            <div class="container">
                {from 'services' get entry '{ slug }'}
                <div class="service-header">
                    <div class="service-icon-large">{ icon }</div>
                    <h1>{ title }</h1>
                    {if entry has price}
                    <p class="service-price-large">{ price }</p>
                    {endif}
                </div>
                
                <div class="service-content">
                    <p class="lead">{ description }</p>
                    {if entry has content}
                    <div class="content">{ content }</div>
                    {endif}
                </div>
                
                <div class="service-cta">
                    <a href="/demo-website/contact.html" class="btn btn-primary">Get Started</a>
                </div>
                {endget}
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; HaruCMS { current_year }</p>
        </div>
    </footer>

    <script src="/harucms-client.js" data-cms-url="http://localhost:8080"></script>
</body>
</html>
