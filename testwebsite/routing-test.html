<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routing Test - HaruCMS</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #222; margin: 0; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 2rem; }
    .btn { display: inline-block; padding: 0.5rem 1rem; background: #2563eb; color: white; text-decoration: none; border-radius: 4px; margin: 0.5rem; }
    .btn:hover { background: #1d4ed8; }
    .status { padding: 1rem; margin: 1rem 0; border-radius: 4px; }
    .status.routing { background: #f0f9ff; border: 1px solid #0ea5e9; }
    .status.legacy { background: #fef3c7; border: 1px solid #f59e0b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HaruCMS Routing Test</h1>
    
    <div id="status" class="status">
      <strong>Status:</strong> <span id="mode">Checking...</span>
    </div>
    
    <h2>Navigation Test</h2>
    <nav>
      <a href="./" class="btn">Home</a>
      <a href="./blog" class="btn">Blog</a>
      <a href="./blog/sample-post-9" class="btn">Sample Post 9</a>
      <a href="./blog/sample-post-10" class="btn">Sample Post 10</a>
    </nav>
    
    <h2>Content Area</h2>
    <div id="content">
      <p>This content will be replaced by the router.</p>
    </div>
    
    <h2>Manual Navigation</h2>
    <button onclick="window.HaruCMS.navigate('./')" class="btn">Go Home</button>
    <button onclick="window.HaruCMS.navigate('./blog')" class="btn">Go to Blog</button>
    <button onclick="window.HaruCMS.navigate('./blog/sample-post-9')" class="btn">Go to Sample Post 9</button>
  </div>

  <script src="/cms-template.v2.js"></script>
  <script>
    // Enable routing mode
    window.location.hash = '#routing';
    
    // Check if routing is enabled
    setTimeout(() => {
      const urlParams = new URLSearchParams(window.location.search);
      const routingMode = urlParams.get('routing') === 'true' || window.location.hash === '#routing';
      
      const statusEl = document.getElementById('status');
      const modeEl = document.getElementById('mode');
      
      if (routingMode) {
        statusEl.className = 'status routing';
        modeEl.textContent = 'Dynamic Routing Enabled';
      } else {
        statusEl.className = 'status legacy';
        modeEl.textContent = 'Legacy Mode (Static Templates)';
      }
    }, 100);
  </script>
</body>
</html>
