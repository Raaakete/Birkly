<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HaruCMS Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/admin/css/style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar p-3">
      <div class="sidebar-header mb-3 text-center">
        <span class="h1" style="letter-spacing:1px;">HaruCMS</span>
      </div>
      <ul class="nav-links flex-col gap-2 w-100">
        <li><a href="#dashboard" data-page="dashboard">📊 Dashboard</a></li>
        <li class="nav-section">Content Management</li>
        <li><a href="#content" data-page="content">📦 Collections</a></li>
        <li class="nav-section">Media & Files</li>
        <li><a href="#media" data-page="media">🖼️ Media</a></li>
        <li class="nav-section">System</li>
        <li><a href="#settings" data-page="settings">⚙️ Settings</a></li>
        <li><a href="#users" data-page="users">👥 Users</a></li>
        <!-- Plugin links will be injected here -->
      </ul>
      <div class="theme-switcher mt-3" id="sidebarThemeSwitcher">
        <button type="button" class="theme-btn" data-theme="light" title="Light Mode" aria-label="Light Mode">☀️</button>
        <button type="button" class="theme-btn" data-theme="dark" title="Dark Mode" aria-label="Dark Mode">🌙</button>
        <button type="button" class="theme-btn" data-theme="system" title="System Theme" aria-label="System Theme">🖥️</button>
      </div>
    </nav>
    <main class="main-content p-3"></main>
  </div>
  <script src="/admin/js/utils.js"></script>
  <script src="/admin/js/theme.js"></script>
</body>
</html>
