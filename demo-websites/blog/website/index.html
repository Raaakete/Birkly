<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{site_title} - Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>{site_title}</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="blog-posts">
            {for each entry in 'blog' sort="created_at:desc"}
            <article class="post-card">
                <h2><a href="post.html?slug={slug}">{title}</a></h2>
                <div class="post-meta">
                    <time>{created_at|date:"F j, Y"}</time>
                    {if tags exist}
                    <div class="tags">
                        {foreach tags as tag}
                        <span class="tag">{tag}</span>
                        {endforeach}
                    </div>
                    {endif}
                </div>
                {if excerpt exist}
                <p class="excerpt">{excerpt}</p>
                {endif}
                <a href="post.html?slug={slug}" class="read-more">Read More →</a>
            </article>
            {endforeach}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; {site_title} {current_year}</p>
        </div>
    </footer>
</body>
</html>
