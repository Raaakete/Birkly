name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: ci-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run CI checks
        run: |
          chmod +x scripts/ci-check.sh scripts/agent-smoke-test.sh scripts/auth-probe.sh
          ./scripts/ci-check.sh
