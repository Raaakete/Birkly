name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: public-syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax on core files
        run: |
          set -e
          for f in server-router.php index.php admin/index.php core/version.php scripts/validate-project-templates.php; do
            php -l "$f"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Template engine CI check
        run: ./scripts/ci-check.sh

      - name: Public CI note
        run: echo 'Public CI OK — syntax and template engine (full suite in private Birkly-Marketplace)'
