name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  syntax:
    name: public-syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax on core files
        run: |
          set -e
          for f in server-router.php index.php admin/index.php core/version.php; do
            php -l "$f"
          done
          echo "Public CI: syntax OK (full test suite runs in private Birkly-Marketplace internal workspace)"
