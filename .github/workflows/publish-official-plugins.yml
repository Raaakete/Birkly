name: Publish official plugins

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to publish (defaults to tag or plugin.json)'
        required: false
        type: string
      dry_run:
        description: 'Build zips only; skip registry upload'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: publish-official-plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build and publish official plugin zips
        env:
          MARKETPLACE_URL: https://marketplace.birkly.io
          MARKETPLACE_REGISTRY_PUBLISH_TOKEN: ${{ secrets.MARKETPLACE_REGISTRY_PUBLISH_TOKEN }}
          CHANGELOG: Release ${{ github.ref_name }}
        run: |
          chmod +x scripts/build-plugin-zip.sh scripts/build-all-official-plugin-zips.sh scripts/publish-official-plugins.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ./scripts/publish-official-plugins.sh --dry-run "${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ./scripts/publish-official-plugins.sh "${{ inputs.version }}"
          else
            ./scripts/publish-official-plugins.sh
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-plugin-zips
          path: dist/plugins/*.zip
          if-no-files-found: error
