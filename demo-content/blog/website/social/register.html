<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register – HaruSocial</title>
    <link rel="stylesheet" href="/project/styles.css">
    <link rel="stylesheet" href="/project/social/social.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/project/social/index.html">HaruSocial</a></h1>
            <nav>
                <a href="/project/social/index.html">Feed</a>
                <a href="/project/social/login.html">Login</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 2rem; max-width: 720px;">
        <div class="card">
            <div class="card-body">
                <h2 style="margin-top:0;">Create account</h2>
                <p class="text-muted">Public self-registration for the demo social project.</p>

                {if query.error exist}
                <div class="text-muted" style="margin: .75rem 0; border-left: 4px solid #d33; padding-left: .75rem;">
                    <strong>Error:</strong> { query.error }
                </div>
                {endif}

                <form method="POST" action="/api/index.php">
                    <input type="hidden" name="route" value="user_registration" />
                    <input type="hidden" name="action" value="register" />
                    <input type="hidden" name="_haru_redirect" value="/project/social/login.html" />
                    <div class="form-group">
                        <label>Name</label>
                        <input name="name" class="form-control" type="text" autocomplete="name" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input name="email" class="form-control" type="email" autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input name="password" class="form-control" type="password" autocomplete="new-password" />
                        <small class="text-muted">Min 8 characters.</small>
                    </div>
                    <div class="d-flex justify-between align-center">
                        <a class="text-muted" href="/project/social/login.html">Already have an account?</a>
                        <button class="btn btn-primary" type="submit">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="/birkly-client.js?v=dev8" data-cms-url="http://localhost:8080"></script>
</body>
</html>
