<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – HaruSocial</title>
    <link rel="stylesheet" href="/demo-website/styles.css">
    <link rel="stylesheet" href="/demo-website/social/social.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/demo-website/social/index.html">HaruSocial</a></h1>
            <nav>
                <a href="/demo-website/social/index.html">Feed</a>
                <a href="/demo-website/social/login.html">Login</a>
                <a href="/demo-website/social/register.html">Register</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 2rem; max-width: 720px;">
        <div class="card">
            <div class="card-body">
                <h2 style="margin-top:0;">Login</h2>
                <p class="text-muted">Use a demo account or your newly registered user.</p>
                <p class="text-muted" style="margin-top:.5rem;"><strong>BUILD:</strong> dev3</p>

                <form method="POST" action="/api/index.php">
                    <input type="hidden" name="route" value="user_auth" />
                    <input type="hidden" name="action" value="login" />
                    <input type="hidden" name="_haru_redirect" value="/demo-website/social/index.html" />
                    <div class="form-group">
                        <label>Email</label>
                        <input name="email" class="form-control" type="email" autocomplete="email" placeholder="e.g. alice@demo.social" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input name="password" class="form-control" type="password" autocomplete="current-password" placeholder="e.g. demo12345" />
                    </div>
                    <div class="d-flex justify-between align-center">
                        <a class="text-muted" href="/demo-website/social/register.html">Create account</a>
                        <button class="btn btn-primary" type="submit">Login</button>
                    </div>
                </form>

                {if query.error exist}
                <div class="text-muted" style="margin: .75rem 0; border-left: 4px solid #d33; padding-left: .75rem;">
                    <strong>Error:</strong> { query.error }
                </div>
                {endif}
                {if query.ok exist}
                <div class="text-muted" style="margin: .75rem 0; border-left: 4px solid #2a7; padding-left: .75rem;">
                    <strong>OK:</strong> { query.ok }
                </div>
                {endif}
            </div>
        </div>
    </main>
    <script src="/birkly-client.js?v=dev8" data-cms-url="http://localhost:8080"></script>
</body>
</html>
