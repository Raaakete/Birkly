<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Birkly</title>
    <link rel="stylesheet" href="/demo-website/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/demo-website/index.html">Birkly</a></h1>
            <nav>
                <a href="/demo-website/index.html">Home</a>
                <a href="/demo-website/services.html">Services</a>
                <a href="/demo-website/blog.html">Blog</a>
                <a href="/demo-website/about.html" class="active">About</a>
                <a href="/demo-website/contact.html">Contact</a>
                <div class="language-selector">
                    <select id="language-select" data-birkly-language-select>
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                    </select>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                {for each entry in 'about' with status = published ordered by newest}
                <h1>{ title }</h1>
                {if entry has 'subtitle'}
                <p class="page-subtitle">{'subtitle'}</p>
                {endif}
                {endfor}
            </div>
        </section>

        <section class="about-section">
            <div class="container">
                {for each entry in 'about' with status = published ordered by newest}
        <article class="post">
            <div class="post-content">
                        {'content'}
                    </div>
                </article>
                {endfor}
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; Birkly 2025</p>
        </div>
    </footer>

    <script src="/birkly-client.js" data-cms-url="http://localhost:8080"></script>
</body>
</html>
