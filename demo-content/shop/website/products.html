<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Birkly Shop Demo</title>
    <link rel="stylesheet" href="/demo-website/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/demo-website/index.html">Birkly Shop</a></h1>
            <nav>
                <a href="/demo-website/index.html">Home</a>
                <a href="/demo-website/products.html">Products</a>
                <a href="/demo-website/about.html">About</a>
                <a href="/demo-website/contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="services-section">
            <div class="container">
                <h1 class="section-title">All products</h1>
                <div class="services-grid">
                    {for each entry in 'products' with status = published ordered by newest}
                    <div class="service-card">
                        <h3>{ title }</h3>
                        <p class="service-description">{ description }</p>
                        {if entry has 'price'}
                        <p class="service-price">{'price'}</p>
                        {endif}
                    </div>
                    {endfor}
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; Birkly Shop Demo — powered by Birkly CMS</p>
        </div>
    </footer>

    <script src="/birkly-client.js"></script>
</body>
</html>
